[project]
name = "cedear-valuation-tool"
version = "0.1.0"
description = "A modular tool to scrape financial data and calculate intrinsic value for CEDEARs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "html5lib>=1.1",
    "lxml>=4.9.0",
    "openpyxl>=3.1.0",
    "yfinance>=0.2.30",
    "hatchling>=1.18.0",
    "playwright>=1.62.0",
]

[project.scripts]
financial-data-scrapper = "cedear_valuation.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cedear_valuation"]
